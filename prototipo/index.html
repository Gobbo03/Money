<title>Da Niko Ortofrutta</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Kalam:wght@700&display=swap">
<style>
/* Layout: app shell — sticky header with demo role switch, one column of content (max 1100px), bottom tab bar like a phone app. */
:root{
  --bg:#f5f7f2; --surface:#ffffff; --surface-2:#edf1e8; --ink:#1c2a1f; --muted:#5d6a5f; --line:#dce3d6;
  --leaf:#1f6a3b; --leaf-ink:#ffffff; --leaf-soft:#e0eee3;
  --chestnut:#743c1b; --chestnut-ink:#fff7ef; --chestnut-soft:#f6e7da;
  --tag:#f6c945; --tag-ink:#2a2000;
  --danger:#b3261e; --danger-ink:#ffffff; --danger-soft:#fbe8e6;
  --warn:#9a5800; --warn-soft:#fff0d4; --info:#235a85; --info-soft:#e2edf7;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-tag:Kalam,"Segoe Print","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111511; --surface:#191f1a; --surface-2:#222a23; --ink:#e7ede5; --muted:#a2ada3; --line:#2e382f;
  --leaf:#6cc78b; --leaf-ink:#0b1a0f; --leaf-soft:#1d3324;
  --chestnut:#e0a271; --chestnut-ink:#2a1407; --chestnut-soft:#3a2617;
  --tag:#f2c94c; --tag-ink:#2a2000;
  --danger:#ff8a80; --danger-ink:#2a0b08; --danger-soft:#3a1b19;
  --warn:#f2b35c; --warn-soft:#382a13; --info:#8fc2ec; --info-soft:#18293a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111511; --surface:#191f1a; --surface-2:#222a23; --ink:#e7ede5; --muted:#a2ada3; --line:#2e382f;
  --leaf:#6cc78b; --leaf-ink:#0b1a0f; --leaf-soft:#1d3324;
  --chestnut:#e0a271; --chestnut-ink:#2a1407; --chestnut-soft:#3a2617;
  --tag:#f2c94c; --tag-ink:#2a2000;
  --danger:#ff8a80; --danger-ink:#2a0b08; --danger-soft:#3a1b19;
  --warn:#f2b35c; --warn-soft:#382a13; --info:#8fc2ec; --info-soft:#18293a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--leaf)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:.82rem} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px} .stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.demo{background:var(--leaf);color:var(--leaf-ink);font-size:.78rem}
.demo .wrap{display:flex;align-items:center;gap:8px 12px;padding-block:6px;flex-wrap:wrap}
.seg{display:inline-flex;border-radius:999px;padding:2px;background:color-mix(in srgb,var(--leaf-ink) 16%,transparent)}
.seg button{border:0;background:none;color:inherit;padding:4px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.78rem}
.seg button[aria-pressed="true"]{background:var(--leaf-ink);color:var(--leaf)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;line-height:1;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.mark{width:38px;height:38px;border-radius:11px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-family:var(--f-tag);font-size:1.25rem;transform:rotate(-4deg)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--ink);display:block}
.brand small{font-size:.66rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:4px}
.spacer{flex:1}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--danger-ink);font-size:.7rem;font-weight:700;display:grid;place-items:center}
main{padding-block:16px 120px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;max-width:620px}
nav.tabs button{flex:1;padding:9px 2px 8px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .dot{top:2px;right:calc(50% - 22px)}

/* buttons, forms */
.btn{border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);text-decoration:none;min-height:42px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:.78rem}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-weight:400;font-size:.95rem;min-width:0}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--leaf);flex:none;margin-top:1px}
.switch{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--leaf)} .switch:checked::after{left:21px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--ink)}
.note.warn{background:var(--warn-soft)} .note.info{background:var(--info-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)} .pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}

/* hero promotions */
.hero-row{display:grid;grid-auto-flow:column;grid-auto-columns:min(88%,520px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-bottom:16px}
.hero{scroll-snap-align:start;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;background:var(--chestnut);color:var(--chestnut-ink);min-width:0}
.hero.alt{background:var(--leaf-soft);color:var(--ink)}
.hero h2{font-size:1.3rem;margin:4px 0 6px}
.hero p{font-size:.9rem;opacity:.92}
.hero-emo{font-size:3.4rem;line-height:1;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}

/* search + chips */
.search input{padding:12px 14px;border-radius:999px;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,176px);gap:12px;overflow-x:auto;padding-bottom:6px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.pc.off .pimg,.pc.off .pname{opacity:.45}
.pimg{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:2.9rem;position:relative}
.badges{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ptag{font-family:var(--f-tag);background:var(--tag);color:var(--tag-ink);padding:1px 8px 0;border-radius:4px;font-size:.95rem;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.stag{background:var(--leaf);color:var(--leaf-ink);font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.pname{font-weight:600;font-size:.92rem;line-height:1.25}
.porig{font-size:.72rem;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--f-tag);font-size:1.3rem;line-height:1;color:var(--ink)}
.price b.sale{color:var(--danger)}
.price s{color:var(--muted);font-size:.78rem}
.price span{font-size:.75rem;color:var(--muted)}
.pfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.modes{display:flex;background:var(--surface-2);border-radius:9px;padding:2px}
.modes button{flex:1;border:0;background:none;border-radius:7px;padding:4px;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--leaf);color:var(--leaf-ink);border-radius:11px;min-height:38px}
.qty button{border:0;background:none;color:inherit;width:38px;height:38px;font-size:1.25rem;font-weight:700;cursor:pointer}
.qty span{font-weight:700;font-size:.88rem}
.est{font-size:.72rem;color:var(--muted);text-align:center}

/* cart + orders */
.line{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .em{font-size:1.8rem;text-align:center}
.line .qty{min-height:32px;width:116px} .line .qty button{width:32px;height:32px}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.tot.big{font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt b{font-size:.98rem}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:74px}
.day b{display:block;font-size:.95rem} .day span{font-size:.72rem;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.day[aria-pressed="true"] span{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.slot small{font-weight:500;font-size:.68rem;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.slot[aria-pressed="true"] small{color:inherit}
.slot[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.timeline{display:flex;gap:4px;margin:6px 0 2px}
.timeline i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.timeline i.on{background:var(--leaf)}
.ocard{display:flex;flex-direction:column;gap:8px;cursor:default}
.ocard.click{cursor:pointer}
.ocard.click:hover{border-color:var(--leaf)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.pick{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.pick:last-child{border-bottom:0}
.pick.done .pn{text-decoration:line-through;color:var(--muted)}
.pick.miss{opacity:.6}
.weigh{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.weigh input{width:110px}
.arow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow .em{font-size:1.6rem;text-align:center}
.arow .pr{width:92px}
.cal{overflow-x:auto}
.cal table{border-collapse:collapse;font-size:.8rem;min-width:560px;width:100%}
.cal th,.cal td{padding:5px 3px;text-align:center}
.cal th:first-child,.cal td:first-child{text-align:left;white-space:nowrap;padding-right:10px}
.cal td.m span{display:block;height:14px;border-radius:3px;background:var(--surface-2)}
.cal td.m.on span{background:var(--leaf)}
.cal th.now{color:var(--leaf)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months label{display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:2px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.info-grid .card h3{margin-bottom:6px}

/* overlays */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:80%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ntf{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.ntf.unread b{color:var(--leaf)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92%,460px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){ .hero-row{grid-auto-columns:calc(50% - 6px)} }
</style>

<div id="app"></div>

<script>
/* ===== Dati di base ===== */
const KEY = 'daniko-prototipo-v1';
const CATS = ['Frutta','Verdura','Latticini e uova','Formaggi','Salumi','Pasta e riso','Pane e forno','Dispensa','Bevande'];
const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

  ricevuto:{l:'Ricevuto',c:'info',s:1}, preparazione:{l:'In preparazione',c:'warn',s:2},
  pronto:{l:'Pronto',c:'ok',s:3}, in_consegna:{l:'In consegna',c:'info',s:4},

};
const PAY = {carta:'Carta online', contanti:'Contanti', pos:'Bancomat / carta (POS)'};

function P(id,cat,emoji,name,unit,price,o){
  return Object.assign({id,cat,emoji,name,unit,price,step:unit==='kg'?0.5:1,avg:0,origin:'Italia',
    available:true,offer:null,season:{mode:'off',months:[]},desc:''},o||{});
}
const au = (...m) => ({mode:'auto',months:m});

function seedProducts(){ return [
  P('castagne','Frutta','🌰','Castagne di montagna','kg',6.90,{origin:'Italia · Cuneo',season:{mode:'on',months:[10,11,12]},offer:{type:'pct',value:15,label:'-15%'},desc:'Calibro grosso, perfette per caldarroste.'}),
  P('cachi','Frutta','🟠','Cachi','kg',2.80,{avg:0.25,origin:'Italia · Emilia-Romagna',season:au(10,11,12)}),
  P('melagrane','Frutta','🔴','Melagrane','kg',3.50,{avg:0.35,origin:'Italia · Sicilia',season:au(9,10,11,12)}),
  P('mele','Frutta','🍎','Mele Golden','kg',2.20,{avg:0.2,origin:'Italia · Trentino',season:au(8,9,10,11,12,1,2,3,4)}),
  P('pere','Frutta','🍐','Pere Abate','kg',2.90,{avg:0.25,origin:'Italia · Emilia-Romagna',season:au(8,9,10,11,12,1)}),
  P('clementine','Frutta','🍊','Clementine','kg',2.40,{origin:'Italia · Calabria',season:au(11,12,1,2),offer:{type:'price',value:1.99,label:'Prezzo speciale'}}),
  P('kiwi','Frutta','🥝','Kiwi','kg',3.20,{avg:0.1,origin:'Italia · Lazio',season:au(11,12,1,2,3,4)}),
  P('uva','Frutta','🍇','Uva Italia','kg',3.50,{origin:'Italia · Puglia',season:au(8,9,10),available:false}),
  P('limoni','Frutta','🍋','Limoni','kg',2.60,{avg:0.15,origin:'Italia · Sicilia',season:au(11,12,1,2,3,4,5)}),
  P('arance','Frutta','🍊','Arance Tarocco','kg',1.90,{origin:'Italia · Sicilia',season:au(12,1,2,3,4)}),
  P('banane','Frutta','🍌','Banane','kg',1.99,{origin:'Ecuador'}),
  P('avocado','Frutta','🥑','Avocado','pz',1.20,{origin:'Perù'}),
  P('zucca','Verdura','🎃','Zucca Delica','kg',1.80,{avg:1.5,origin:'Italia · Mantova',season:au(9,10,11,12)}),
  P('porcini','Verdura','🍄','Funghi porcini','kg',24.90,{step:0.25,origin:'Italia · Appennino',season:au(9,10,11)}),

/* ===== Utilità ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round(x*100)/100;
const eur = n => (n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const nf = x => x.toLocaleString('it-IT',{maximumFractionDigits:2});
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const hm = t => `${pad(Math.floor(t/60))}:${pad(t%60)}`;
const uid = () => Math.random().toString(36).slice(2,9);
const clock = t => new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
function dayLabel(s){
  const t = new Date(); const tm = new Date(); tm.setDate(t.getDate()+1);
  if (s === ds(t)) return 'Oggi';
  if (s === ds(tm)) return 'Domani';
  return pd(s).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
}
function nextOpenDay(){ const d = new Date(); if (d.getDay()===0) d.setDate(d.getDate()+1); return ds(d); }
const month = () => new Date().getMonth()+1;

function eff(p){ if(!p.offer) return p.price; return p.offer.type==='pct' ? r2(p.price*(1-p.offer.value/100)) : p.offer.value; }
const inSeason = p => p.season.mode==='on' || (p.season.mode==='auto' && p.season.months.includes(month()));
const prod = id => S.products.find(p=>p.id===id);
function lineKg(l){ return l.mode==='kg' ? l.qty : l.qty*(l.avg||0); }
function lineEst(l){ return l.unit==='kg' ? lineKg(l)*l.price : l.qty*l.price; }
function lineFinal(l){ if(l.missing) return 0; if(l.unit==='kg' && l.weighed!=null) return l.weighed*l.price; return lineEst(l); }
function qtyLabel(l){
  if (l.mode==='kg') return nf(l.qty)+' kg';
  return l.qty+' pz' + (l.unit==='kg' && l.avg ? ` (~${nf(r2(l.qty*l.avg))} kg)` : '');
}
function orderTotals(o){
  const sub = o.lines.reduce((a,l)=>a+lineFinal(l),0);
  const pending = o.lines.some(l=>l.unit==='kg' && !l.missing && l.weighed==null);
  return {sub:r2(sub), fee:o.fee, total:r2(sub+o.fee), final:!pending};
}

function cartRows(){ return S.cart.map(c=>{ const p=prod(c.pid); return p ? {...c,p,l:{unit:p.unit,mode:c.mode,qty:c.qty,price:eff(p),avg:p.avg}} : null; }).filter(Boolean); }
const cartSub = () => r2(cartRows().reduce((a,r)=>a+lineEst(r.l),0));
const cartCount = () => S.cart.length;
function stepOf(p,mode){ return mode==='kg' ? (p.step||0.5) : 1; }
function cartAdd(pid,mode,dir){
  const p = prod(pid); if(!p || !p.available) return;
  const st = stepOf(p,mode);
  let c = S.cart.find(x=>x.pid===pid && x.mode===mode);
  if (!c) { if (dir<0) return; c = {pid,mode,qty:0}; S.cart.push(c); }
  c.qty = r2(c.qty + dir*st);
  if (c.qty <= 0) S.cart = S.cart.filter(x=>x!==c);
  save();
}

/* ===== Fasce orarie ===== */
const RANGES = [[8*60,13*60],[15*60+30,19*60+30]];
function slotsFor(date, method){
  const d = pd(date); if (d.getDay()===0) return [];
  const step = method==='consegna' ? 60 : 30;
  const now = new Date(); const isToday = date===ds(now);
  const nowMin = now.getHours()*60+now.getMinutes();
  if (isToday && nowMin >= S.settings.cutoff*60) return [];
  const out = [];
  for (const [a,b] of RANGES) for (let t=a; t+step<=b; t+=step) {
    if (isToday && t < nowMin+60) continue;
    const start = hm(t), end = hm(t+step);
    let left = Infinity;
    if (method==='consegna') {
      const used = S.orders.filter(o=>o.method==='consegna' && o.status!=='annullato' && o.slot.date===date && o.slot.start===start).length;
      left = S.settings.perHour - used;
    }
    out.push({start,end,left});
  }
  return out;
}
function openDays(method){
  const out = []; const d = new Date();
  for (let i=0; i<10 && out.length<6; i++){ const s = ds(d); if (slotsFor(s,method).length) out.push(s); d.setDate(d.getDate()+1); }
  return out;
}

/* ---- Cliente: conferma ordine ---- */
function vCheckout(){
  const u = me(); if (!u) { UI.cview='account'; UI.afterLogin='checkout'; return vAccount(); }
  if (!S.cart.length) { UI.cview='cart'; return vCart(); }
  const ck = UI.ck; const st = S.settings;
  if (!ck.address) ck.address = u.address || '';
  const days = openDays(ck.method);
  if (!days.includes(ck.date)) { ck.date = days[0] || null; ck.slot = null; }
  const slots = ck.date ? slotsFor(ck.date, ck.method) : [];
  if (ck.slot && !slots.find(s=>s.start===ck.slot && s.left>0)) ck.slot = null;
  const sub = cartSub();
  const fee = ck.method==='consegna' ? (sub>=st.freeOver?0:st.fee) : 0;
  const underMin = ck.method==='consegna' && sub < st.minDelivery;
  return `<div class="stack-lg"><div class="row"><button class="btn sm ghost" data-a="cv" data-v="cart">← Carrello</button></div><h1>Completa l'ordine</h1>
  <section class="stack"><h2>Come vuoi ricevere la spesa?</h2><div class="grid2">
    <button class="opt" data-a="ck" data-k="method" data-v="ritiro" aria-pressed="${ck.method==='ritiro'}"><b>Ritiro in negozio</b><span class="small muted">Gratis · fasce di 30 minuti</span></button>
    <button class="opt" data-a="ck" data-k="method" data-v="consegna" aria-pressed="${ck.method==='consegna'}"><b>Consegna a domicilio</b><span class="small muted">${eur(st.fee)} · gratis sopra ${eur(st.freeOver)} · entro ${st.radius} km</span></button>
  </div>
  ${ck.method==='consegna'?`<label class="f">Indirizzo di consegna<input type="text" id="ck-address" data-ck="address" value="${esc(ck.address)}" placeholder="Via, numero civico, città" autocomplete="street-address"></label>
  <p class="small muted">Consegniamo entro ${st.radius} km dal negozio. Nella versione finale la distanza si controlla in automatico.</p>
  ${underMin?`<div class="note warn">L'ordine minimo per la consegna è ${eur(st.minDelivery)}. Mancano ${eur(st.minDelivery-sub)}.</div>`:''}`:''}
  </section>
  <section class="stack"><h2>Giorno e orario</h2>
    ${days.length?`<div class="days" role="group" aria-label="Giorno">${days.map(d=>{const dd=pd(d);return `<button class="day" data-a="ck" data-k="date" data-v="${d}" aria-pressed="${ck.date===d}"><span>${dayLabel(d)==='Oggi'||dayLabel(d)==='Domani'?dayLabel(d):dd.toLocaleDateString('it-IT',{weekday:'short'})}</span><b>${dd.getDate()} ${MESI[dd.getMonth()].toLowerCase()}</b></button>`;}).join('')}</div>
    <div class="slots">${slots.map(s=>`<button class="slot" data-a="ck" data-k="slot" data-v="${s.start}" aria-pressed="${ck.slot===s.start}" ${s.left<=0?'disabled':''}>${s.start}–${s.end}${ck.method==='consegna'?`<small>${s.left<=0?'Pieno':s.left===1?'1 posto':s.left+' posti'}</small>`:''}</button>`).join('')}</div>`
    :'<p class="muted">Nessuna fascia disponibile.</p>'}
    <p class="small muted">Gli ordini fatti entro le ${st.cutoff}:00 possono essere ${ck.method==='consegna'?'consegnati':'ritirati'} in giornata.</p>
  </section>
  <section class="stack"><h2>Pagamento</h2><div class="grid2">
    ${['carta','contanti','pos'].map(k=>`<button class="opt" data-a="ck" data-k="pay" data-v="${k}" aria-pressed="${ck.pay===k}"><b>${PAY[k]}</b><span class="small muted">${k==='carta'?'Paghi ora, in modo sicuro':ck.method==='consegna'?'Paghi al fattorino':'Paghi al ritiro'}</span></button>`).join('')}
  </div>
  ${ck.pay==='carta'?`<div class="note info">Sulla carta blocchiamo il totale stimato e addebitiamo solo l'importo esatto dopo la pesatura. Nel prototipo il pagamento è simulato.</div>`:''}
  <label class="check"><input type="checkbox" data-chk="invoice" ${ck.invoice?'checked':''}> Mi serve la fattura</label>
  ${ck.invoice?`<div class="grid2"><label class="f">Codice fiscale o partita IVA<input type="text" id="ck-cf" data-ck="cf" value="${esc(ck.cf)}"></label><label class="f">Ragione sociale <span class="h">(se azienda)</span><input type="text" id="ck-rag" data-ck="ragione" value="${esc(ck.ragione)}"></label></div>`:''}
  </section>
  <section class="stack"><h2>Note per il negozio</h2><textarea id="ck-note" data-ck="note" placeholder="Es. castagne grosse, banane poco mature, citofono…">${esc(ck.note)}</textarea></section>
  <section class="card"><div class="tot"><span>Prodotti (stima)</span><span>${eur(sub)}</span></div>
    ${ck.method==='consegna'?`<div class="tot"><span>Consegna</span><span>${fee?eur(fee):'Gratis'}</span></div>`:''}
    <div class="tot big"><span>Totale stimato</span><span>${eur(sub+fee)}</span></div>
    <p class="small muted" style="margin-top:6px">${esc(u.name)} · ${esc(u.phone||'telefono mancante')}</p></section>

function oCard(o){

    <p class="small">${o.method==='consegna'?'🚚 Consegna':'🏪 Ritiro'} · <b>${dayLabel(o.slot.date)} ${o.slot.start}–${o.slot.end}</b> · ${PAY[o.pay]}</p>

    ${o.status==='ricevuto'?(conf?`<div class="note warn stack"><b>Vuoi annullare l'ordine #${o.num}?</b><div class="row"><button class="btn sm danger" data-a="cancelOrder" data-id="${o.id}">Sì, annulla</button><button class="btn sm ghost" data-a="confirm" data-v="">No</button></div></div>`

      : o.status==='preparazione'?'<p class="small muted">Stiamo preparando la spesa: non è più modificabile. Per cambiamenti chiama il negozio.</p>':''}
  </article>`;
}

/* ---- Negozio: ordini ---- */
function vAOrders(){
  const today = ds(new Date());
  const live = S.orders.filter(o=>o.status!=='annullato');

  const delToday = live.filter(o=>o.method==='consegna' && o.slot.date===today).length;
  const pickToday = live.filter(o=>o.method==='ritiro' && o.slot.date===today).length;
  const valToday = live.filter(o=>o.slot.date===today).reduce((a,o)=>a+orderTotals(o).total,0);
  const F = {todo:['ricevuto','preparazione','pronto','in_consegna'],done:['completato'],canc:['annullato'],all:Object.keys(STATUS)};
  const list = S.orders.filter(o=>F[UI.aFilter].includes(o.status)).sort((a,b)=>(a.slot.date+a.slot.start).localeCompare(b.slot.date+b.slot.start));
  return `<div class="stack"><h1>Ordini</h1>
    <div class="tiles"><div class="tile"><b>${todo}</b><span>Da preparare</span></div><div class="tile"><b>${delToday}</b><span>Consegne oggi</span></div><div class="tile"><b>${pickToday}</b><span>Ritiri oggi</span></div><div class="tile"><b>${eur(valToday)}</b><span>Valore ordini di oggi</span></div></div>

/* ---- Fattorino ---- */
function vDriver(){
  const go = S.orders.filter(o=>o.method==='consegna' && ['pronto','in_consegna'].includes(o.status)).sort((a,b)=>(a.slot.date+a.slot.start).localeCompare(b.slot.date+b.slot.start));
  const soon = S.orders.filter(o=>o.method==='consegna' && ['ricevuto','preparazione'].includes(o.status));
  const doneToday = S.orders.filter(o=>o.method==='consegna' && o.status==='completato' && o.slot.date===ds(new Date())).length;
  return `<div class="stack"><h1>Consegne</h1>
    <div class="tiles"><div class="tile"><b>${go.length}</b><span>Da consegnare</span></div><div class="tile"><b>${soon.length}</b><span>In preparazione</span></div><div class="tile"><b>${doneToday}</b><span>Consegnate oggi</span></div></div>
    ${go.length?go.map(o=>{const t=orderTotals(o);return `<article class="card stack">
      <div class="between"><h2 class="num">${o.slot.start}–${o.slot.end}</h2><span class="pill ${STATUS[o.status].c}">${o.status==='pronto'?'Da ritirare in negozio':'In viaggio'}</span></div>
      <p class="small muted">${dayLabel(o.slot.date)} · ordine #${o.num}</p>
      <div><b>${esc(o.customer.name)}</b><p>${esc(o.customer.address)}</p><p class="num">📞 ${esc(o.customer.phone)}</p></div>
      ${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}
      <div class="note ${o.pay==='carta'?'':'warn'}">${o.pay==='carta'?`Già pagato con carta (${eur(t.total)})`:`Da incassare: <b>${eur(t.total)}</b> · ${PAY[o.pay]}`}</div>
      <div class="row"><a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customer.address)}" target="_blank" rel="noopener">Apri in Maps</a>
      ${o.status==='pronto'?`<button class="btn primary" data-a="dStatus" data-id="${o.id}" data-v="in_consegna">Parto</button>`:`<button class="btn primary" data-a="dStatus" data-id="${o.id}" data-v="completato">Consegnato</button>`}</div></article>`;}).join('')
    :`<div class="card"><p class="muted">Nessuna consegna pronta. Quando il negozio segna un ordine come pronto, compare qui.</p></div>`}
    ${soon.length?`<h2 style="margin-top:10px">In preparazione in negozio</h2>${soon.map(o=>`<div class="card between"><span><b>${o.slot.start}</b> · ${esc(o.customer.name)} · ${esc(o.customer.address)}</span><span class="pill ${STATUS[o.status].c}">${STATUS[o.status].l}</span></div>`).join('')}`:''}
  </div>`;
}

/* ===== Azioni ===== */
const STATUS_MSG = {
  preparazione: o => `Stiamo preparando il tuo ordine #${o.num}`,
  pronto: o => o.method==='consegna' ? `Il tuo ordine #${o.num} è pronto e partirà a breve` : `Il tuo ordine #${o.num} è pronto: ti aspettiamo in negozio`,
  in_consegna: o => `Il fattorino è partito con il tuo ordine #${o.num}`,
  completato: o => `Ordine #${o.num} completato. Grazie!`,
  annullato: o => `Il negozio ha annullato l'ordine #${o.num}. Ti chiamiamo per spiegarti.`
};
function setStatus(o,to){
  if (to==='pronto' && o.lines.some(l=>l.unit==='kg' && !l.missing && l.weighed==null)) { toast('Inserisci il peso reale di tutti i prodotti a peso'); return false; }
  o.status = to; o.history.push({s:to,t:Date.now()});
  if (to==='completato') o.paid = true;
  if (o.userId) notify(o.userId, STATUS_MSG[to](o));
  if (to==='pronto' && o.method==='consegna') notify('driver', `Ordine #${o.num} pronto da consegnare (${o.slot.start})`);
  if (to==='completato' && o.method==='consegna') notify('shop', `Ordine #${o.num} consegnato`);
  save(); return true;
}
const A = {
  role(d){ UI.role=d.v; UI.notifs=false; UI.confirm=null; UI.aOrder=null; render(); scrollTo(0,0); },
  home(){ if(UI.role==='cliente'){UI.cview='shop';} else if(UI.role==='negozio'){UI.aview='orders';UI.aOrder=null;UI.aEdit=null;} render(); scrollTo(0,0); },
  cv(d){ UI.cview=d.v; UI.confirm=null; render(); scrollTo(0,0); },

  cat(d){ UI.cat=d.v; UI.q=''; render(); const g=document.querySelector('.chips'); if(g) g.scrollIntoView({block:'start',behavior:'smooth'}); },
  mode(d){ UI.mode[d.id]=d.m; render(); },
  inc(d){ cartAdd(d.id,d.m,1); render(); },
  dec(d){ cartAdd(d.id,d.m,-1); render(); },
  notifs(){ UI.notifs=true; render(); const aud=audience(); S.notifs.forEach(n=>{ if(n.to===aud) n.read=true; }); save(); },
  closeNotifs(d,el,e){ if(e && e.target.closest('[data-stop]') && !e.target.closest('[data-a="closeNotifs"].btn')) return; UI.notifs=false; render(); },
  toCheckout(){ if(!me()){ UI.afterLogin='checkout'; UI.cview='account'; } else UI.cview='checkout'; render(); scrollTo(0,0); },
  ck(d){ UI.ck[d.k]=d.v; if(d.k==='method'){UI.ck.slot=null;} if(d.k==='date') UI.ck.slot=null; render(); },
  place(){
    const u=me(), ck=UI.ck, st=S.settings;
    if(!ck.slot){ toast('Scegli una fascia oraria'); return; }
    if(ck.method==='consegna' && !ck.address.trim()){ toast('Scrivi l\'indirizzo di consegna'); document.getElementById('ck-address')?.focus(); return; }
    if(!u.phone){ toast('Aggiungi il telefono nel profilo: serve per chiamarti'); return; }
    if(ck.invoice && !ck.cf.trim()){ toast('Inserisci codice fiscale o partita IVA per la fattura'); return; }
    const slot = slotsFor(ck.date,ck.method).find(s=>s.start===ck.slot);
    if(!slot || slot.left<=0){ toast('Questa fascia non è più disponibile, scegline un\'altra'); ck.slot=null; render(); return; }
    const sub=cartSub();
    const lines = cartRows().map(r=>({pid:r.pid,name:r.p.name,emoji:r.p.emoji,unit:r.p.unit,mode:r.mode,qty:r.qty,price:eff(r.p),avg:r.p.avg,weighed:null,picked:false,missing:false}));
    const o = {id:uid(),num:S.nextNum++,userId:u.id,customer:{name:u.name,phone:u.phone,email:u.email,address:ck.method==='consegna'?ck.address.trim():''},
      lines,method:ck.method,slot:{date:ck.date,start:slot.start,end:slot.end},pay:ck.pay,paid:false,
      invoice:ck.invoice?{cf:ck.cf.trim(),name:ck.ragione.trim()}:null,note:ck.note.trim(),status:'ricevuto',created:Date.now(),
      fee:ck.method==='consegna'?(sub>=st.freeOver?0:st.fee):0,history:[{s:'ricevuto',t:Date.now()}]};
    if(ck.method==='consegna' && ck.address.trim() && !u.address){ u.address=ck.address.trim(); }
    S.orders.push(o); S.cart=[]; UI.lastOrder=o.id;
    notify('shop',`Nuovo ordine #${o.num} · ${u.name} · ${o.method} ${dayLabel(o.slot.date).toLowerCase()} ${o.slot.start}`);
    notify(u.id,`Abbiamo ricevuto il tuo ordine #${o.num}`);
    UI.ck={method:ck.method,date:null,slot:null,pay:ck.pay,invoice:false,cf:'',ragione:'',note:'',address:''};
    save(); UI.cview='done'; render(); scrollTo(0,0);
  },
  confirm(d){ UI.confirm=d.v||null; render(); },
  cancelOrder(d){ const o=S.orders.find(x=>x.id===d.id); if(!o||o.status!=='ricevuto'){toast('L\'ordine è già in preparazione: chiama il negozio');UI.confirm=null;render();return;}

  editOrder(d){ const o=S.orders.find(x=>x.id===d.id); if(!o||o.status!=='ricevuto'){toast('L\'ordine è già in preparazione: chiama il negozio');render();return;}
    for(const l of o.lines){ if(!prod(l.pid)) continue; const c=S.cart.find(x=>x.pid===l.pid&&x.mode===l.mode); if(c) c.qty=r2(c.qty+l.qty); else S.cart.push({pid:l.pid,mode:l.mode,qty:l.qty}); }

  closeEdit(){ UI.aEdit=null; render(); },
  newPromo(){ UI.editPromo='new'; render(); },
  editPromo(d){ UI.editPromo=d.id; render(); },
  closePromo(){ UI.editPromo=null; render(); },
  delPromo(d){ S.promos=S.promos.filter(p=>p.id!==d.id); UI.editPromo=null; save(); toast('Promozione eliminata'); render(); },
  endOffer(d){ const p=prod(d.id); p.offer=null; save(); toast(`${p.name}: offerta tolta`); render(); },
  reset(){ try{localStorage.removeItem(KEY);}catch(e){} S=seed(); save(); UI.confirm=null; UI.aview='orders'; toast('Dati di prova ripristinati'); render(); }
};
function afterAuth(){ const next=UI.afterLogin; UI.afterLogin=null; UI.cview = next==='checkout' && S.cart.length ? 'checkout' : 'shop'; render(); scrollTo(0,0); }

const FORMS = {
  login(f){ const email=f.get('email').trim().toLowerCase(); const u=S.users.find(x=>x.email.toLowerCase()===email && x.pass===f.get('pass'));
    if(!u){ toast('Email o password non corretti'); return; } S.session=u.id; save(); toast(`Bentornata/o, ${u.name.split(' ')[0]}`); afterAuth(); },
  register(f){ const email=f.get('email').trim().toLowerCase();
    if(S.users.some(x=>x.email.toLowerCase()===email)){ toast('Esiste già un account con questa email: accedi'); UI.authTab='login'; render(); return; }
    const u={id:uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),email,pass:f.get('pass'),address:f.get('address').trim(),google:false};
    S.users.push(u); S.session=u.id; save(); toast('Account creato'); afterAuth(); },
  profile(f){ const u=me(); u.name=f.get('name').trim(); u.phone=f.get('phone').trim(); u.email=f.get('email').trim(); u.address=f.get('address').trim(); save(); toast('Profilo salvato');
    if(UI.afterLogin==='checkout' && u.phone){ afterAuth(); return; } render(); },
  product(f){
    const id=f.get('id'); const isNew=!id;
    const p = isNew ? P('p'+uid(),'Frutta','🛒','','kg',0) : prod(id);
    p.name=f.get('name').trim(); p.cat=f.get('cat'); p.unit=f.get('unit'); p.price=r2(+f.get('price')||0);
    p.step = p.unit==='kg' ? (+f.get('step')||0.5) : 1; p.avg = p.unit==='kg' ? (+f.get('avg')||0) : 0;
    p.origin=f.get('origin').trim(); p.emoji=f.get('emoji').trim()||'🛒'; p.available=!!f.get('available');
    const ot=f.get('otype'); const ov=+f.get('oval');
    p.offer = ot && ov>0 ? {type:ot,value:ov,label:f.get('olab').trim()||(ot==='pct'?`-${ov}%`:'Offerta')} : null;
    p.season={mode:f.get('smode'),months:f.getAll('m').map(Number)};
    if(isNew) S.products.push(p);
    save(); UI.aEdit=null; toast(`${p.name} salvato`); render();
  },
  promo(f){ const id=f.get('id'); const data={emoji:f.get('emoji').trim()||'🧺',kicker:f.get('kicker').trim(),title:f.get('title').trim(),text:f.get('text').trim()};
    if(id) Object.assign(S.promos.find(p=>p.id===id),data); else S.promos.unshift({id:uid(),active:true,...data});
    UI.editPromo=null; save(); toast('Promozione pubblicata'); render(); },
  settings(f){ const st=S.settings;
    for(const k of ['fee','freeOver','minDelivery','perHour','radius','cutoff']){ const v=+f.get(k); if(!isNaN(v)) st[k]=v; }
    for(const k of ['shopAddress','shopPhone','shopEmail']) st[k]=f.get(k).trim();
    save(); toast('Impostazioni salvate'); render(); }
};

/* ===== Eventi ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const f = A[el.dataset.a]; if(!f) return;
  if (el.dataset.a==='closeNotifs' && el.classList.contains('sheet-bg') && e.target!==el) return;
  e.preventDefault(); f(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.ocard.click')) { e.preventDefault(); e.target.click(); }
  if (e.key==='Escape' && UI.notifs) { UI.notifs=false; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in==='q'){ UI.q=t.value; document.getElementById('grid').innerHTML=gridHTML(); }
  else if (t.dataset.in==='aq'){ UI.aQ=t.value; document.getElementById('alist').innerHTML=aListHTML(); }
  else if (t.dataset.ck){ UI.ck[t.dataset.ck]=t.value; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.chk==='invoice'){ UI.ck.invoice=t.checked; render(); }
  else if (d.chk==='pick'){ const l=S.orders.find(x=>x.id===d.o).lines[+d.i]; l.picked=t.checked; save(); render(); }
  else if (d.chk==='avail'){ const p=prod(d.id); p.available=t.checked; save(); toast(`${p.name}: ${p.available?'disponibile':'esaurito'}`); }
  else if (d.chk==='promo'){ const p=S.promos.find(x=>x.id===d.id); p.active=t.checked; save(); toast(p.active?'Promozione visibile':'Promozione nascosta'); }
  else if (d.chw){ const o=S.orders.find(x=>x.id===d.o); const l=o.lines[+d.i]; const v=parseFloat(String(t.value).replace(',','.'));
    l.weighed = isNaN(v)||v<=0 ? null : r2(v); if(l.weighed!=null) l.picked=true; save(); render(); }
  else if (d.chp){ const p=prod(d.chp); const v=parseFloat(String(t.value).replace(',','.')); if(!isNaN(v)&&v>=0){ p.price=r2(v); save(); toast(`${p.name}: ${eur(p.price)}`); } }
  else if (d.chs==='acat'){ UI.aCat=t.value; document.getElementById('alist').innerHTML=aListHTML(); }
});
document.addEventListener('submit', e => {
  const f = e.target; const h = FORMS[f.dataset.form]; if(!h) return;
  e.preventDefault(); h(new FormData(f));
});

render();
</script>
